name: Check and deploy Scientific Method Lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify every original example and existing browser journeys
        run: npm run check
      - name: Verify offline contract, cold Python and guarded updates
        run: CHROMIUM=$(python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)") npm run test:offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: verified-course
          include-hidden-files: true
          path: dist
  publish:
    concurrency:
      group: course-publication
      cancel-in-progress: false
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        with:
          name: verified-course
          path: dist
      - name: Verify the downloaded publication artifact
        run: node scripts/verify-offline-build.mjs dist
      - name: Preserve assets for older open lessons
        env:
          PUBLISHED_COURSE_URL: https://snowch.github.io/scientific-method-lab/
        run: node scripts/retain-for-publish.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publication.mjs wait github-pages-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
